  <style>
    /* Material Symbols rendering */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      line-height: 1;
    }

    /* Thin, tasteful scrollbars */
    ::-webkit-scrollbar        { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track  { background: transparent; }
    ::-webkit-scrollbar-thumb  { background: #dcd9d8; border-radius: 10px; }
    * { scrollbar-width: thin; scrollbar-color: #dcd9d8 transparent; }

    /* Horizontal timeline scroll without scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Timeline fade mask */
    .timeline-mask {
      mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    }

    /* Details/summary arrow tweak */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary .material-symbols-outlined { transform: rotate(90deg); }

    /* Smooth page transitions */
    #app > * { animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
