[project]
name = "ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6.6",
    "google-auth>=2.47.0",
    "google-cloud-storage>=3.7.0",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
