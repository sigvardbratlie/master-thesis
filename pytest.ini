[pytest]
# Pytest konfigurasjon for monorepo med flere test-mapper

# Hvor pytest skal lete etter tester
testpaths = 
    agent/tests
    ui/tests
    data/tests

# Python path for å finne moduler
pythonpath = 
    agent/src
    ui/src
    data/src

# Test fil patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio support
asyncio_mode = auto

# Addopts for bedre output
addopts = 
    -v
    --tb=short
    --strict-markers
    
# Markers du kan bruke (optional)
markers =
    agent: tests for agent module
    ui: tests for ui module
    data: tests for data module
    slow: marks tests as slow
    integration: marks tests as integration tests
