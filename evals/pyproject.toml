[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent",
    "deepeval>=3.8.4",
    "google-cloud-storage",
    "pytest",
    "pytest-asyncio",
    "matplotlib==3.10.8",
    "openpyxl",
    "pydantic",
    "python-docx",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "bert-score>=0.3.13",
    "ipywidgets>=8.1.8",
]

[project.scripts]
evals = "evals:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
agent = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live GCS / Supabase — run with -m integration",
]
