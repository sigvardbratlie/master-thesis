[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent",
    "annotated-types==0.7.0",
    "asttokens==3.0.1",
    "beautifulsoup4==4.14.3",
    "bs4==0.0.2",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "comm==0.2.3",
    "cryptography==46.0.5",
    "decorator==5.2.1",
    "deepeval>=3.8.4",
    "defusedxml==0.7.1",
    "deprecated==1.3.1",
    "deprecation==2.1.0",
    "et-xmlfile==2.0.0",
    "executing==2.2.1",
    "fonttools==4.61.1",
    "fpdf2==2.8.5",
    "google-cloud-storage",
    "pytest",
    "pytest-asyncio",
    "img2pdf==0.6.3",
    "ipython==9.10.0",
    "ipython-pygments-lexers==1.1.1",
    "ipywidgets==8.1.8",
    "jedi==0.19.2",
    "jupyterlab-widgets==3.0.16",
    "lxml==6.0.2",
    "markdown-it-py==4.0.0",
    "matplotlib-inline==0.2.1",
    "mdurl==0.1.2",
    "mutagen==1.47.0",
    "ocrmypdf==17.2.0",
    "openpyxl==3.1.5",
    "packaging==26.0",
    "parso==0.8.6",
    "pdfminer-six==20260107",
    "pexpect==4.9.0",
    "pi-heif==1.2.1",
    "piexif==1.1.3",
    "pikepdf==10.3.0",
    "pillow==12.1.1",
    "pluggy==1.6.0",
    "prompt-toolkit==3.0.52",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pypdf2==3.0.1",
    "pypdfium2==5.4.0",
    "python-docx==1.2.0",
    "rich==14.3.2",
    "soupsieve==2.8.3",
    "stack-data==0.6.3",
    "tinytag==2.2.0",
    "traitlets==5.14.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uharfbuzz==0.53.3",
    "wcwidth==0.6.0",
    "widgetsnbextension==4.0.15",
    "wrapt==2.1.1",
]

[project.scripts]
evals = "evals:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
agent = { workspace = true, editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live GCS / Supabase — run with -m integration",
]
