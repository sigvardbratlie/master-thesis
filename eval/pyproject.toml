authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "ipywidgets>=8.1.8",
    "mutagen>=1.47.0",
    "ocrmypdf>=16.13.0",
    "openpyxl>=3.1.5",
    "piexif>=1.1.3",
