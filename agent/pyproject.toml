[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-firestore>=2.22.0",
    "google-cloud-storage>=3.7.0",
    "langchain>=1.2.2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.6",
    "langchain-google-community[featurestore]>=3.0.3",
    "langchain-google-genai>=4.1.3",
    "langchain-openai>=1.1.7",
    "langchain-tavily>=0.2.16",
    "langgraph>=1.0.5",
    "pandas-gbq>=0.33.0",
    "pyjwt>=2.10.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.1",
    "supabase>=2.27.2",
    "tiktoken>=0.12.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
